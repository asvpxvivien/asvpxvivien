<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Vivien Amagbegnon portfolio, vivamg.dev" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#6FD3FF"/>
      <stop offset="0.55" stop-color="#38A8E0"/>
      <stop offset="1" stop-color="#1B6F9C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38A8E0" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#1B6F9C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FD3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6FD3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6FD3FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="220" rx="18"/></clipPath>
    <clipPath id="btn"><rect x="628" y="88" width="208" height="48" rx="24"/></clipPath>
    <style>
      .label { font: 500 11px 'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 0.16em; fill: #7A8497; }
      .title { font: 800 34px 'Sora', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.045em; }
      .body  { font: 400 14px 'Manrope', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #B8C0CF; }
      .btn   { font: 600 15px 'Manrope', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #050609; }
      .halo  { transform-origin: 170px 110px; animation: breathe 6s ease-in-out infinite; }
      .shine { animation: shine 3.2s ease-in-out infinite; }
      .arrow { animation: nudge 1.6s ease-in-out infinite; }
      .dot   { animation: blink 2s steps(1) infinite; }
      @keyframes breathe { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes shine { 0% { transform: translateX(-120px); } 60%,100% { transform: translateX(260px); } }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .halo, .shine, .arrow, .dot { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="220" fill="#050609"/>
    <ellipse class="halo" cx="170" cy="110" rx="300" ry="190" fill="url(#halo)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="219" rx="17.5" fill="none" stroke="rgba(255,255,255,0.09)"/>
  <g transform="translate(44 62) scale(3)">
    <path transform="skewX(-10)" d="M6.5 6 L12.5 6 L16.8 20.5 L24.5 6 L30 6 L18.5 26 L12 26 Z" fill="url(#cyan)"/>
  </g>
  <text x="178" y="62" class="label">PORTFOLIO</text>
  <circle class="dot" cx="272" cy="58" r="3" fill="#38A8E0"/>
  <text x="176" y="104" class="title" fill="#F4F7FB">See the apps</text>
  <text x="176" y="142" class="title" fill="url(#cyan)">I have shipped.</text>
  <text x="178" y="174" class="body">Mobile apps, case studies and how to reach me.</text>
  <rect x="628" y="88" width="208" height="48" rx="24" fill="url(#cyan)"/>
  <g clip-path="url(#btn)">
    <rect class="shine" x="628" y="88" width="90" height="48" fill="url(#sweep)"/>
  </g>
  <text x="660" y="117" class="btn">vivamg.dev</text>
  <g class="arrow">
    <path d="M790 112 H806 M800 106 L806 112 L800 118" stroke="#050609" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
