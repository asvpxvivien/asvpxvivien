name: Profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 heures
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=github&bg_color=050609&title_color=F4F7FB&text_color=B8C0CF&icon_color=38A8E0&ring_color=38A8E0
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Carte de streak, générée ici au lieu du service externe
      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=050609&ring=38A8E0&fire=6FD3FF&currStreakLabel=38A8E0&sideLabels=B8C0CF&dates=7A8497&sideNums=F4F7FB&currStreakNum=F4F7FB
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update profile cards" || exit 0
          git push
