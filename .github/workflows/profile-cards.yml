name: Profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 heures
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=github&bg_color=050609&title_color=F4F7FB&text_color=B8C0CF&icon_color=38A8E0&ring_color=38A8E0
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=050609&title_color=F4F7FB&text_color=B8C0CF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/snake-dark.svg?color_snake=#F4F7FB&color_dots=#10141D,#1B6F9C,#2A8CC4,#38A8E0,#6FD3FF
            profile/snake-light.svg?color_snake=#0A0C10&color_dots=#EBEDF0,#A8D8F0,#6FB8E0,#1B7FB8,#1466A0

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update profile cards" || exit 0
          git push
